services:
  keepalive:
    image: node:20-alpine
    container_name: hoster24-keepalive
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    environment:
      MC_HOST: server.hoster24.org
      MC_PORT: "24825"
      MC_USER: qx47_kp9z2
      # 服务器 online-mode=false（2026-10-18 确认），离线直登；用户名须与 whitelist.json 一致
      MC_AUTH: offline
      STAY_MIN: "60"
      INTERVAL_H: "4"
    command: sh -c "npm install --no-audit --no-fund && sh entrypoint.sh"
